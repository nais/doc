name: Check pull request
on: pull_request

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests and Action pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5.2.6
        with:
          install: true
          cache: true
      - name: Run checks
        run: mise run check
