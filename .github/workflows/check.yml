name: Check pull request
on: pull_request

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests and Action pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5.2.7
        with:
          install: true
          cache: true
      - name: Run checks
        run: mise run check
