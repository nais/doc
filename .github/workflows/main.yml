name: Build and publish doc
on: push
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tenants.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Discover tenants from nais-tenant-data bucket
        id: tenants
        run: echo "matrix=$(node svdoc/scripts/list-tenants.mjs --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0 # required for git date plugin

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5.2.7
        with:
          install: true
          cache: true

      - name: Build documentation
        run: mise run build

      - name: Upload generated doc artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: out-folder
          path: out # This uploads all the files in the out folder, not the folder itself

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false # one tenant with a broken/missing bucket should not block the rest
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Download generated doc artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8
        with:
          name: out-folder

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: nais-doc-sa@nais-io.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3.0.1

      # SvelteKit emits content-hashed files under `_app/immutable/`; those are
      # safe to cache for a year. Everything else gets a short TTL so deploys
      # propagate quickly. Cache-Control is set at upload time via `gsutil -h`,
      # so unchanged objects (rsync -c) keep their existing metadata and we
      # avoid a full-bucket `setmeta` rewrite on every deploy.
      - name: Sync immutable assets (long cache)
        run: |
          gsutil -h 'Cache-Control:public, max-age=31536000, immutable' \
            -m rsync -r -c \
            ${{ matrix.tenant }}/_app/immutable/ \
            gs://${{ matrix.bucket }}/_app/immutable/

      - name: Sync remaining content (short cache)
        run: |
          gsutil -h 'Cache-Control:public, max-age=180' \
            -m rsync -r -c -d \
            -x '^_app/immutable/.*$' \
            ${{ matrix.tenant }}/ \
            gs://${{ matrix.bucket }}
