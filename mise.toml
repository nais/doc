[settings]
pin = true

[tools]
node = "24.22.1"
pnpm = "11.22.0"
go = "1.27.3"
"go:github.com/sethvargo/ratchet" = "0.12.0"

[tasks.setup]
description = "Install svdoc dependencies"
dir = "svdoc"
run = "pnpm install --frozen-lockfile"

[tasks."local:dev"]
description = "Run the svdoc dev server with optional tenant"
dir = "svdoc"
usage = '''
arg "<tenant>" help="Target tenant" default="nav"
'''
run = "TENANT=${usage_tenant} pnpm run dev"

[tasks.local]
description = "Setup and run the svdoc dev server"
depends = ["setup"]
run = "mise run local:dev"

[tasks.build]
description = "Build svdoc for one or more tenants. Usage: mise run build nav ssb"
depends = ["setup"]
dir = "svdoc"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ "$#" -eq 0 ]; then
  echo "Usage: mise run build <tenant> [<tenant>...]" >&2
  exit 1
fi

rm -rf ../out
mkdir -p ../out

for TENANT in "$@"; do
  echo "Building for tenant: ${TENANT}"
  TENANT="${TENANT}" NOT_TENANT="not-${TENANT}" pnpm run build
  mv build "../out/${TENANT}"
done
'''

[tasks.check]
description = "Run all checks (lint, svelte-check, tests and Action pinning)"
depends = ["check:lint", "check:svelte-check", "check:test", "check:ratchet"]

[tasks."check:ratchet"]
description = "Verify all GitHub Actions are pinned"
run = "ratchet lint .github/workflows/*.yml"

[tasks."check:test"]
description = "Run unit tests for svdoc"
depends = ["setup"]
dir = "svdoc"
run = "pnpm test"

[tasks."check:lint"]
description = "Run prettier and eslint on svdoc"
depends = ["setup"]
dir = "svdoc"
run = "pnpm run lint"

[tasks."check:svelte-check"]
description = "Run svelte-check on svdoc"
depends = ["setup"]
dir = "svdoc"
run = "pnpm run check"

[tasks.fmt]
description = "Format svdoc with prettier"
depends = ["setup"]
dir = "svdoc"
run = "pnpm run format"
